[secret]
# International format, country code included.
phone_number = +33600000000
pin = 1234

# Optional. Leave empty to solve the WAF challenge with headless Chrome on
# every run. Reusing a device_info keeps the same device identity across runs,
# which is what the official web client does.
waf_token =
device_info =

[general]
# csv or json
output_format = csv
output_folder = out

# Fetch the detail view of every transaction: fees, quantities, venues.
# One extra request per transaction, so expect a slower run.
extract_details = false
